name: Build Automation-V1

on:
workflow_dispatch:

jobs:
build-windows:
runs-on: windows-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm

  - name: Install dependencies
    run: npm install

  - name: Install Playwright Chromium
    run: npx playwright install chromium

  - name: Build portable EXE
    run: npm run build

  - name: Verify EXE
    shell: powershell
    run: |
      $exe = "dist\Automation-V1.exe"
      if (!(Test-Path $exe)) {
        Write-Error "Automation-V1.exe was not created."
        exit 1
      }

      $size = (Get-Item $exe).Length

      Write-Host "EXE FOUND: YES"
      Write-Host "EXE SIZE: $size bytes"

      if ($size -le 0) {
        Write-Error "EXE size is zero."
        exit 1
      }

  - name: Locate Playwright browsers
    shell: powershell
    run: |
      $browserPath = Join-Path $env:LOCALAPPDATA "ms-playwright"

      if (!(Test-Path $browserPath)) {
        Write-Error "Playwright browser directory not found."
        exit 1
      }

      Write-Host "PLAYWRIGHT BROWSERS: FOUND"
      Write-Host "PATH: $browserPath"

  - name: Assemble portable package
    shell: powershell
    run: |
      $portable = "Automation-V1-Portable"

      if (Test-Path $portable) {
        Remove-Item $portable -Recurse -Force
      }

      New-Item -ItemType Directory -Path $portable | Out-Null
      New-Item -ItemType Directory -Path "$portable\input" | Out-Null

      Copy-Item "dist\Automation-V1.exe" "$portable\Automation-V1.exe"

      Copy-Item "$env:LOCALAPPDATA\ms-playwright" "$portable\ms-playwright" -Recurse

      Copy-Item "input\scene-1.txt" "$portable\input\scene-1.txt"

      Write-Host "PORTABLE PACKAGE: CREATED"
      Write-Host "INPUT SCENE: INCLUDED"
      Write-Host "MASTER IMAGE: NOT INCLUDED"

  - name: Create ZIP
    shell: powershell
    run: |
      Compress-Archive `
        -Path "Automation-V1-Portable\*" `
        -DestinationPath "Automation-V1-Portable.zip" `
        -Force

      $zip = Get-Item "Automation-V1-Portable.zip"

      Write-Host "ZIP CREATED: YES"
      Write-Host "ZIP SIZE: $($zip.Length) bytes"

  - name: Upload build artifact
    uses: actions/upload-artifact@v4
    with:
      name: Automation-V1-Portable
      path: Automation-V1-Portable.zip
      if-no-files-found: error
```
