name: Build Automation-V1
on: workflow_dispatch
jobs: {build-windows: {runs-on: windows-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: 20, cache: npm}}, {run: npm install}, {run: npx playwright install chromium}, {run: npm run build}, {shell: powershell, run: 'if (!(Test-Path "dist\Automation-V1.exe")) { throw "Automation-V1.exe was not created." }; $size = (Get-Item "dist\Automation-V1.exe").Length; Write-Host "EXE FOUND: YES"; Write-Host "EXE SIZE: $size bytes"; if ($size -le 0) { throw "EXE size is zero." }'}, {shell: powershell, run: '$browserPath = Join-Path $env:LOCALAPPDATA "ms-playwright"; if (!(Test-Path $browserPath)) { throw "Playwright browsers not found." }; Write-Host "PLAYWRIGHT BROWSERS: FOUND"'}, {shell: powershell, run: '$portable = "Automation-V1-Portable"; if (Test-Path $portable) { Remove-Item $portable -Recurse -Force }; New-Item -ItemType Directory -Path "$portable\input" | Out-Null; Copy-Item "dist\Automation-V1.exe" "$portable\Automation-V1.exe"; Copy-Item "$env:LOCALAPPDATA\ms-playwright" "$portable\ms-playwright" -Recurse; Copy-Item "input\scene-1.txt" "$portable\input\scene-1.txt"'}, {shell: powershell, run: 'Compress-Archive -Path "Automation-V1-Portable*" -DestinationPath "Automation-V1-Portable.zip" -Force; Write-Host "ZIP CREATED: YES"'}, {uses: actions/upload-artifact@v4, with: {name: Automation-V1-Portable, path: Automation-V1-Portable.zip, if-no-files-found: error}}]}}
